<section class="featured-release">
  <div class="featured-release__content">
    <p class="section-kicker">From The Corner Store</p>

    <h2>{{ site.data.featured.featured_release.title }}</h2>

    <p>
      {{ site.data.featured.featured_release.description }}
    </p>

    {% include streaming-links.html release=site.data.featured.featured_release %}
  </div>

  <iframe
      style="border-radius:12px"
      src="https://open.spotify.com/embed/{{ site.data.featured.featured_release.spotify_type }}/{{ site.data.featured.featured_release.spotify_id }}"
      title="Listen to {{ site.data.featured.featured_release.title | escape }} on Spotify"
      width="100%"
      height="352"
      frameborder="0"
      allowfullscreen=""
      allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
      loading="lazy">
  </iframe>
</section>
