title: Bob Running
description: Gritty Americana from the Banks of the Ohio

collections:
  - releases
  - videos
  - reels
  - events

defaults:
  - scope:
      path: "releases"
      type: "releases"
    values:
      layout: "release"
  - scope:
      path: "reels"
      type: "reels"
    values:
      layout: "reel"
  - scope:
      path: "videos"
      type: "videos"
    values:
      layout: "video"

root: /

url: https://bobrunning.com
baseurl: ""
